# Production-style additions, auto-merged on top of the official Airflow compose.
#
# On the VM:
#   1. Fetch the official base (matching your Airflow image version), e.g.:
#        curl -LfO https://airflow.apache.org/docs/apache-airflow/3.0.2/docker-compose.yaml
#   2. cp .env.example .env  &&  edit .env  (set NEBIUS_API_KEY)
#   3. docker build -t evaluate-agent:latest .
#   4. docker compose up -d        # merges docker-compose.yaml + this override
#
# This override:
#   - adds MinIO (S3-compatible storage) + a one-shot bucket creator
#   - adds an MLflow server backed by MinIO
#   - injects our env + the project bind mount + the Docker socket into the Airflow
#     services so DockerOperator tasks and the summarize step have what they need.
#
# NOTE: the airflow-* service names below match the official 3.0.2 compose. If your
# Airflow version renames them, align these keys with the names in docker-compose.yaml.

x-extra-environment: &extra-environment
  # The repo is bind-mounted at $HOST_PROJECT; put it on PYTHONPATH so the DAGs can
  # import the `pipeline` package (only dags/ is on the default Airflow dags path).
  PYTHONPATH: ${HOST_PROJECT:-/opt/project}
  NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
  MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
  ARTIFACT_BUCKET: ${ARTIFACT_BUCKET:-mlops-artifacts}
  HOST_PROJECT: ${HOST_PROJECT:-/opt/project}
  EVALUATE_AGENT_IMAGE: ${EVALUATE_AGENT_IMAGE:-evaluate-agent:latest}
  # Deps are baked into the custom Airflow image (docker/airflow.Dockerfile, set via
  # AIRFLOW_IMAGE_NAME) under Airflow's constraints — NOT installed at boot, which would
  # clobber celery/kombu and crash the worker.

x-extra-volumes: &extra-volumes
  # Bind the host repo at the SAME absolute path so SWE-bench's docker-out-of-docker
  # sibling containers resolve paths consistently. Mount the Docker socket for DockerOperator.
  - ${HOST_PROJECT:-/opt/project}:${HOST_PROJECT:-/opt/project}
  - /var/run/docker.sock:/var/run/docker.sock

services:
  airflow-apiserver:
    environment: *extra-environment
    volumes: *extra-volumes
  airflow-scheduler:
    environment: *extra-environment
    volumes: *extra-volumes
  airflow-dag-processor:
    environment: *extra-environment
    volumes: *extra-volumes
  airflow-worker:
    environment: *extra-environment
    volumes: *extra-volumes
    # DockerOperator tasks run on the worker and must reach the Docker socket.
    # Add the host's docker group so the in-container airflow user can use it.
    group_add:
      - ${DOCKER_GID:-999}
  airflow-triggerer:
    environment: *extra-environment
    volumes: *extra-volumes
  airflow-init:
    environment: *extra-environment
    volumes: *extra-volumes

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${ARTIFACT_BUCKET:-mlops-artifacts}
      "

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://${ARTIFACT_BUCKET:-mlops-artifacts}/mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      # MLflow >=3.5 DNS-rebinding protection: setting this REPLACES the default allow-list,
      # so include both the in-network service name (worker -> http://mlflow:5000) AND
      # localhost (browser via SSH-forwarded host port) or the UI is rejected too.
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow,mlflow:5000,localhost,localhost:5001,127.0.0.1,127.0.0.1:5001
    # Internal address stays mlflow:5000 (used by the Airflow services); only the
    # published host port is configurable to avoid clashes (host 5000 may be taken).
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio-data:
  mlflow-data:
